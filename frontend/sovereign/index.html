<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Seraph — Kov Unleashed</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;background:#0b0e14;color:#e8e6e1;margin:0;display:flex;flex-direction:column;align-items:center;padding:2rem;min-height:90vh}
  h1{font-size:1.2rem;margin-bottom:.2rem}
  .sub{color:#8a8f98;font-size:.85rem;margin-bottom:2rem}
  #mic{width:120px;height:120px;border-radius:50%;border:none;background:#e05252;color:#fff;font-size:.95rem;cursor:pointer;box-shadow:0 0 0 0 rgba(224,82,82,.5);transition:transform .15s}
  #mic.rec{background:#8a2be2;transform:scale(1.08);animation:pulse 1.2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 18px rgba(224,82,82,0)}}
  #status{margin:1.2rem 0;color:#8a8f98;font-size:.85rem;min-height:1.2em}
  #out{max-width:560px;width:100%}
  #ops{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;max-width:560px;margin-bottom:1.2rem}
  #ops span{background:#131722;border:1px solid #232a3a;color:#8a8f98;font-size:.68rem;padding:.25rem .6rem;border-radius:999px}
  #ops span.live{color:#4ad295;border-color:#1f4d38}
  .msg{background:#131722;border-radius:10px;padding:.9rem 1.1rem;margin:.5rem 0;font-size:.95rem;line-height:1.45}
  .you{border-left:3px solid #4a8fe7}.atlas{border-left:3px solid #e05252}
  audio{width:100%;margin-top:.6rem}
</style>
</head>
<body>
<h1>Seraph</h1>
<div class="sub">Kov unleashed — sovereign voice brain, powered by Ollama</div>
<button id="mic">TAP TO&nbsp;TALK</button>
<div id="status">idle</div>
<div id="ops">operator bridge…</div>
<div id="out"></div>
<script>
const mic=document.getElementById('mic'),status=document.getElementById('status'),out=document.getElementById('out');
let media=null,rec=null,chunks=[],busy=false,actx=null;
function unlock(){if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}
mic.onclick=async()=>{
  if(busy)return;
  unlock(); // in-gesture: audio context must live here (iOS) or later play() blocks
  if(rec&&rec.state==='recording'){rec.stop();return;}
  try{
    if(!media)media=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];
    rec=new MediaRecorder(media);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>send(chunks);
    rec.start();mic.classList.add('rec');mic.textContent='TAP TO&nbsp;SEND';status.textContent='listening…';
  }catch(e){status.textContent='mic blocked: '+e.message;}
};
async function send(chunks){
  mic.classList.remove('rec');mic.innerHTML='TAP TO&nbsp;TALK';busy=true;
  status.textContent='thinking…';
  const fd=new FormData();
  const mt=(rec&&rec.mimeType)||'audio/webm'; // iOS records mp4 — send the REAL mime
  const ext=mt.includes('mp4')?'m4a':mt.includes('ogg')?'ogg':mt.includes('wav')?'wav':'webm';
  fd.append('audio',new Blob(chunks,{type:mt}),'utterance.'+ext);
  try{
    const r=await fetch('/api/turn',{method:'POST',body:fd});
    const j=await r.json();
    if(j.error){status.textContent='error: '+j.error;}
    else{
      add('you',j.transcript||'(no transcript)');
      add('atlas',j.reply+(j.operator?'  [operator: '+j.operator+']':''));
      status.textContent='';
      if(j.audio_b64){
        const url='data:audio/mp3;base64,'+j.audio_b64;
        try{ // WebAudio path: context unlocked at tap-time, survives autoplay policy
          const raw=Uint8Array.from(j.audio_b64.split('').map(c=>c.charCodeAt(0)));
          if(actx.state==='suspended')actx.resume();
          const buf=await actx.decodeAudioData(raw.buffer);
          const src=actx.createBufferSource();src.buffer=buf;src.connect(actx.destination);src.start();
        }catch(perr){ // fallback: element autoplays where allowed
          new Audio(url).play().catch(()=>{status.textContent='tap ▶ to hear';});
        }
        const p=document.createElement('audio');p.controls=true;p.src=url; // manual player, always present
        const msg=out.firstElementChild;if(msg)msg.appendChild(p);
      }
    }
  }catch(e){status.textContent='server error: '+e;}
  busy=false;
}
function add(who,text){
  const d=document.createElement('div');d.className='msg '+who;
  d.textContent=(who==='you'?'You: ':'Seraph: ')+text;
  out.prepend(d);
}
(async()=>{ // operator capability strip
  const ops=document.getElementById('ops');
  try{
    const j=await(await fetch('/api/operator')).json();
    ops.innerHTML=j.enabled
      ? j.capabilities.map(c=>`<span class="${c.mutates?'':'live'}">${c.tool}${c.mutates?' *':''}</span>`).join('')
      : '<span>operator bridge off</span>';
  }catch(e){ops.innerHTML='<span>operator bridge unreachable</span>';}
})();
</script>
</body>
</html>
